# Databricks App config. Deploy from the repo root's `app/` folder (see README).
command: ["uvicorn", "backend.main:app", "--host", "0.0.0.0", "--port", "8000"]
env:
  - name: DEMO_MODE
    value: "true"
  - name: DATA_BACKEND
    value: "databricks"
  - name: FIXIT_CATALOG
    value: "fixit"
  - name: FIXIT_DATA_DIR            # only used if you flip DATA_BACKEND to "local" as a stage fallback
    value: "/tmp/fixit-data"
  - name: DATABRICKS_WAREHOUSE_ID
    valueFrom: sql-warehouse        # app resource key; bind the warehouse in the App UI
  - name: CHAT_ENDPOINT
    value: "databricks-llama-4-maverick"   # verified 2026-11-14 (chat nonce + 3/3 random-color vision); alt: databricks-gemma-3-12b
  - name: VISION_ENDPOINT
    value: "databricks-llama-4-maverick"
  - name: EMBEDDING_ENDPOINT
    value: "databricks-gte-large-en"
  - name: GENIE_SPACE_ID            # "FixIt Madison — Ask the data" (created 2026-11-14 by scripts/genie_setup.py)
    value: "01f1e089ff07126aac09984f839aaef1"
